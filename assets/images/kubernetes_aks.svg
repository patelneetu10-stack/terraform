<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="k8sBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#326CE5" />
      <stop offset="100%" stop-color="#00A4EF" />
    </linearGradient>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="180" fill="#326ce5" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="450" r="220" fill="#00d2ff" opacity="0.09" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="250" fill="#6366f1" opacity="0.06" filter="url(#glow)"/>

  <!-- Top Bar / Header Simulation -->
  <rect x="50" y="40" width="1100" height="60" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="80" cy="70" r="6" fill="#ef4444"/>
  <circle cx="102" cy="70" r="6" fill="#f59e0b"/>
  <circle cx="124" cy="70" r="6" fill="#10b981"/>

  <!-- Title & Status -->
  <text x="160" y="76" fill="#f8fafc" font-size="16" font-weight="600" letter-spacing="0.5">Azure Kubernetes Service (AKS) Cluster Topology</text>
  <rect x="880" y="55" width="115" height="30" rx="15" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <circle cx="900" cy="70" r="4" fill="#10b981" filter="url(#subtleGlow)"/>
  <text x="912" y="75" fill="#34d399" font-size="12" font-weight="600">CLUSTER READY</text>
  <text x="1015" y="75" fill="#94a3b8" font-size="13">Nodes: 3/3 Healthy</text>

  <!-- Left: Traffic Ingestion & Ingress Layer -->
  <g transform="translate(60, 130)">
    <rect width="250" height="500" rx="16" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    
    <text x="25" y="40" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1">1. INGRESS &amp; SECURITY</text>
    <line x1="25" y1="52" x2="225" y2="52" stroke="rgba(255,255,255,0.08)"/>

    <!-- Internet Influx -->
    <rect x="25" y="75" width="200" height="65" rx="10" fill="#1e293b" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="45" y="105" fill="#f1f5f9" font-size="14" font-weight="600">Client Requests (HTTPS)</text>
    <text x="45" y="125" fill="#64748b" font-size="11">TLS Termination / Port 443</text>

    <!-- Arrow down -->
    <path d="M 125 140 L 125 165" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="120,165 130,165 125,172" fill="#38bdf8"/>

    <!-- Azure Front Door / App Gateway -->
    <rect x="25" y="175" width="200" height="75" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="45" y="205" fill="#38bdf8" font-size="13" font-weight="700">Azure Application Gateway</text>
    <text x="45" y="224" fill="#94a3b8" font-size="11">WAF v2 &amp; SSL Offload</text>
    <text x="45" y="240" fill="#10b981" font-size="10">● Status: Active | 0 DDoS</text>

    <!-- Arrow down -->
    <path d="M 125 250 L 125 275" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="120,275 130,275 125,282" fill="#38bdf8"/>

    <!-- Ingress Controller (NGINX) -->
    <rect x="25" y="285" width="200" height="85" rx="10" fill="#1e293b" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="45" y="315" fill="#f8fafc" font-size="14" font-weight="600">NGINX Ingress Controller</text>
    <text x="45" y="335" fill="#94a3b8" font-size="11">Path-based routing / cert-manager</text>
    <text x="45" y="352" fill="#38bdf8" font-size="10">Routing: /api/* → Microservices</text>

    <!-- Azure Key Vault Secrets Integration -->
    <rect x="25" y="395" width="200" height="80" rx="10" fill="rgba(99, 102, 241, 0.12)" stroke="#6366f1" stroke-width="1"/>
    <text x="45" y="425" fill="#a5b4fc" font-size="13" font-weight="700">Azure Key Vault CSI Driver</text>
    <text x="45" y="445" fill="#cbd5e1" font-size="11">Managed Identity Authentication</text>
    <text x="45" y="462" fill="#10b981" font-size="10">● Auto secret rotation synced</text>
  </g>

  <!-- Center: AKS Worker Nodes & Pods -->
  <g transform="translate(340, 130)">
    <rect width="520" height="500" rx="16" fill="url(#cardGrad)" stroke="rgba(50, 108, 229, 0.3)" stroke-width="1.5"/>
    
    <text x="30" y="40" fill="#60a5fa" font-size="14" font-weight="700" letter-spacing="1">2. PRODUCTION AKS WORKER NODES (VIRTUAL NETWORK)</text>
    <line x1="30" y1="52" x2="490" y2="52" stroke="rgba(255,255,255,0.08)"/>

    <!-- Node 1 -->
    <rect x="25" y="70" width="470" height="120" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="45" y="98" fill="#93c5fd" font-size="13" font-weight="700">NodePool-01 (Standard_D4s_v5) - Availability Zone 1</text>
    <text x="430" y="98" fill="#10b981" font-size="11">CPU: 28%</text>

    <!-- Pods in Node 1 -->
    <rect x="45" y="112" width="130" height="62" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="58" y="134" fill="#f8fafc" font-size="12" font-weight="600">Auth Service</text>
    <text x="58" y="150" fill="#94a3b8" font-size="10">Pod: auth-6b9f-x1</text>
    <circle cx="160" cy="130" r="3.5" fill="#10b981"/>

    <rect x="195" y="112" width="130" height="62" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="208" y="134" fill="#f8fafc" font-size="12" font-weight="600">Patient API</text>
    <text x="208" y="150" fill="#94a3b8" font-size="10">Pod: api-84c1-9k</text>
    <circle cx="310" cy="130" r="3.5" fill="#10b981"/>

    <rect x="345" y="112" width="130" height="62" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="358" y="134" fill="#f8fafc" font-size="12" font-weight="600">Telemetry Ingest</text>
    <text x="358" y="150" fill="#94a3b8" font-size="10">Pod: ingest-33d-p</text>
    <circle cx="460" cy="130" r="3.5" fill="#10b981"/>

    <!-- Node 2 -->
    <rect x="25" y="210" width="470" height="120" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="45" y="238" fill="#93c5fd" font-size="13" font-weight="700">NodePool-02 (Standard_D4s_v5) - Availability Zone 2</text>
    <text x="430" y="238" fill="#10b981" font-size="11">CPU: 34%</text>

    <!-- Pods in Node 2 -->
    <rect x="45" y="252" width="130" height="62" rx="8" fill="#1e293b" stroke="#00d2ff" stroke-width="1"/>
    <text x="58" y="274" fill="#f8fafc" font-size="12" font-weight="600">Auth Service</text>
    <text x="58" y="290" fill="#94a3b8" font-size="10">Pod: auth-6b9f-x2</text>
    <circle cx="160" cy="270" r="3.5" fill="#10b981"/>

    <rect x="195" y="252" width="130" height="62" rx="8" fill="#1e293b" stroke="#00d2ff" stroke-width="1"/>
    <text x="208" y="274" fill="#f8fafc" font-size="12" font-weight="600">Patient API</text>
    <text x="208" y="290" fill="#94a3b8" font-size="10">Pod: api-84c1-2w</text>
    <circle cx="310" cy="270" r="3.5" fill="#10b981"/>

    <rect x="345" y="252" width="130" height="62" rx="8" fill="#1e293b" stroke="#00d2ff" stroke-width="1"/>
    <text x="358" y="274" fill="#f8fafc" font-size="12" font-weight="600">Notification Svc</text>
    <text x="358" y="290" fill="#94a3b8" font-size="10">Pod: notif-77a-9</text>
    <circle cx="460" cy="270" r="3.5" fill="#10b981"/>

    <!-- Pod Auto-scaling (HPA) & Helm Release Info -->
    <rect x="25" y="350" width="470" height="125" rx="12" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255,255,255,0.06)"/>
    <text x="45" y="380" fill="#f8fafc" font-size="13" font-weight="600">Horizontal Pod Autoscaler (HPA) &amp; Helm Management</text>
    
    <rect x="45" y="398" width="135" height="55" rx="6" fill="#0f172a"/>
    <text x="58" y="420" fill="#38bdf8" font-size="11" font-weight="700">HELM CHARTS</text>
    <text x="58" y="438" fill="#94a3b8" font-size="10">v2.4.0 Deployed</text>

    <rect x="195" y="398" width="135" height="55" rx="6" fill="#0f172a"/>
    <text x="208" y="420" fill="#10b981" font-size="11" font-weight="700">TARGET CPU</text>
    <text x="208" y="438" fill="#94a3b8" font-size="10">HPA threshold: 70%</text>

    <rect x="345" y="398" width="135" height="55" rx="6" fill="#0f172a"/>
    <text x="358" y="420" fill="#c084fc" font-size="11" font-weight="700">ZERO DOWNTIME</text>
    <text x="358" y="438" fill="#94a3b8" font-size="10">Rolling updates</text>
  </g>

  <!-- Right: Azure Observability & Persistence -->
  <g transform="translate(885, 130)">
    <rect width="255" height="500" rx="16" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
    
    <text x="25" y="40" fill="#34d399" font-size="14" font-weight="700" letter-spacing="1">3. OBSERVABILITY &amp; DATA</text>
    <line x1="25" y1="52" x2="230" y2="52" stroke="rgba(255,255,255,0.08)"/>

    <!-- Azure Monitor & Container Insights -->
    <rect x="25" y="75" width="205" height="90" rx="10" fill="#0f172a" stroke="rgba(52, 211, 153, 0.3)"/>
    <text x="40" y="102" fill="#34d399" font-size="13" font-weight="700">Azure Container Insights</text>
    <text x="40" y="122" fill="#94a3b8" font-size="11">Prometheus metrics scraped</text>
    <text x="40" y="140" fill="#cbd5e1" font-size="10">Live Pod Logs &amp; Metrics stream</text>
    <circle cx="210" cy="100" r="4" fill="#34d399" filter="url(#subtleGlow)"/>

    <!-- Azure Log Analytics -->
    <rect x="25" y="180" width="205" height="90" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
    <text x="40" y="207" fill="#60a5fa" font-size="13" font-weight="700">Log Analytics Workspace</text>
    <text x="40" y="227" fill="#94a3b8" font-size="11">KQL Custom Dashboards</text>
    <text x="40" y="245" fill="#f59e0b" font-size="10">Alerts configured: 24/7 pager</text>

    <!-- Azure Managed Database / Persistence -->
    <rect x="25" y="285" width="205" height="95" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
    <text x="40" y="312" fill="#f8fafc" font-size="13" font-weight="700">Azure Database for PostgreSQL</text>
    <text x="40" y="332" fill="#94a3b8" font-size="11">Private Endpoint Connected</text>
    <text x="40" y="350" fill="#10b981" font-size="10">Automated Daily Backups</text>

    <!-- Azure Container Registry (ACR) -->
    <rect x="25" y="395" width="205" height="85" rx="10" fill="rgba(0, 120, 212, 0.15)" stroke="#0078d4"/>
    <text x="40" y="422" fill="#38bdf8" font-size="13" font-weight="700">Azure Container Registry</text>
    <text x="40" y="442" fill="#94a3b8" font-size="11">Vulnerability scanning active</text>
    <text x="40" y="460" fill="#10b981" font-size="10">Microsoft Defender scan: Clean</text>
  </g>
</svg>
